
{% extends "base.html" %}
{% block title %}Create Account | Eesha's Store{% endblock %}

{% block content %}
<section class="auth-section container">
    <div class="auth-card">
        <p class="eyebrow text-center">JOIN OUR COMMUNITY</p>
        <h1 class="text-center">Make it yours.</h1>
        <p class="text-center text-muted mb-4">Create your account and save the styles you love.</p>

        <form method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Full name</label>
                <input type="text" id="name" name="name" class="form-control" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" minlength="8" autocomplete="new-password" required>
                <small class="text-muted">Use at least 8 characters.</small>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-dark btn-lg w-100">Create account</button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login</a>
        </p>
    </div>
</section>
{% endblock %}
